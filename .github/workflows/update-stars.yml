name: Update starred repositories

on:
  workflow_dispatch:
    inputs:
      reanalyze:
        description: "Re-analyze all repositories (needed after changing the model or categories)"
        type: boolean
        default: false
  schedule:
    # 04:00 UTC daily
    # 06:00 in Sweden during CEST, 05:00 during CET
    - cron: "0 4 * * *"

permissions:
  contents: write

concurrency:
  group: update-stars
  cancel-in-progress: true

env:
  STARMAN_VERSION: "0.1.2"
  STARMAN_GITHUB_TOKEN: ${{ github.token }}
  STARMAN_AI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install starman
        run: |
          curl -fsSL \
            -o /tmp/starman \
            "https://github.com/morehao/starman/releases/download/v${STARMAN_VERSION}/starman_${STARMAN_VERSION}_linux_amd64"

          sudo install -m 0755 /tmp/starman /usr/local/bin/starman

          starman --version

      - name: Restore starman database
        run: |
          mkdir -p "$HOME/.starman"

          if [ -f starman-backup/starman.db ]; then
            cp starman-backup/starman.db "$HOME/.starman/starman.db"
            echo "Restored existing starman database"
          else
            echo "No existing database; this is the first run"
          fi

      - name: Configure starman
        run: |
          cat > "$HOME/.starman/config.yaml" <<EOF
          github:
            username: "${GITHUB_REPOSITORY_OWNER}"

          ai:
            base_url: "https://api.openai.com/v1"
            model: "gpt-6-luna"
            concurrency: 3

          generate:
            sort: "category"
          EOF

      # Mirror the request starman sends, including its fixed temperature
      - name: Test OpenAI API
        run: |
          curl --fail-with-body -sS \
            https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer ${STARMAN_AI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gpt-6-luna",
              "temperature": 0.3,
              "messages": [
                {
                  "role": "user",
                  "content": "Return a JSON object with ok=true"
                }
              ],
              "response_format": {
                "type": "json_object"
              }
            }'

      - name: Sync GitHub stars
        run: |
          starman sync --full

      - name: Configure categories
        run: |
          # starman matches the AI's tags against these keywords as
          # case-insensitive substrings in both directions, and the first
          # category with a hit wins. Custom categories are checked first,
          # then built-ins by sort order (specific topics before broad ones).
          # The AI mostly tags repos with category names, so each category
          # lists its own name. Avoid short keywords like "ai" or "ui" that
          # match inside unrelated words.

          starman category edit ai-ml \
            --name "AI and Machine Learning" \
            --keywords "ai and machine learning,machine learning,machine-learning,deep learning,artificial intelligence,llm,人工智能" \
            --sort-order 1

          starman category edit security \
            --name "Security" \
            --keywords "security,encryption,pentest,vulnerability,网络安全,加密" \
            --sort-order 2

          starman category edit game \
            --name "Games and Graphics" \
            --keywords "games and graphics,gaming,game,游戏" \
            --sort-order 3

          starman category edit database \
            --name "Databases" \
            --keywords "databases,database,数据库" \
            --sort-order 4

          starman category edit data-analysis \
            --name "Data and Analytics" \
            --keywords "data and analytics,analytics,visualization,可视化" \
            --sort-order 5

          starman category edit design \
            --name "Design" \
            --keywords "ui design,graphic design,themes,icon theme,设计,主题" \
            --sort-order 6

          starman category edit social \
            --name "Social and Communication" \
            --keywords "social and communication,communication,messaging,chat,社交" \
            --sort-order 7

          starman category edit education \
            --name "Learning and Documentation" \
            --keywords "learning and documentation,documentation,tutorial,education" \
            --sort-order 8

          starman category edit mobile-app \
            --name "Mobile Apps" \
            --keywords "mobile apps,mobile,android,ios app,移动" \
            --sort-order 9

          starman category edit desktop-app \
            --name "Desktop Apps" \
            --keywords "desktop apps,desktop,wayland,compositor,window manager,gnome,kde,桌面" \
            --sort-order 10

          starman category edit web-app \
            --name "Web Apps" \
            --keywords "web apps,web app,web 应用,frontend,browser extension,浏览器扩展,前端" \
            --sort-order 11

          starman category edit productivity \
            --name "Productivity and Automation" \
            --keywords "productivity and automation,productivity,automation,home assistant,file management,file sharing,自动化,生产力,智能家居,文件管理" \
            --sort-order 12

          starman category edit dev-tools \
            --name "Developer Tools" \
            --keywords "developer tools,developer-tools,开发工具,开发者工具" \
            --sort-order 13

          # Add some more useful custom categories.

          starman category add self-hosted \
            --name "Self Hosted" \
            --keywords "self hosted,self-hosted,selfhosted,homelab,自托管" \
            --sort-order 20

          starman category add devops-infrastructure \
            --name "DevOps and Infrastructure" \
            --keywords "devops,docker,kubernetes,terraform,ansible,infrastructure,observability,monitoring" \
            --sort-order 21

          starman category add cli-terminal \
            --name "CLI and Terminal" \
            --keywords "cli and terminal,command-line,command line,terminal,命令行,终端" \
            --sort-order 22

          starman category add libraries-sdks \
            --name "Libraries and SDKs" \
            --keywords "libraries and sdks,sdk" \
            --sort-order 23

      - name: Analyze repositories
        env:
          REANALYZE: ${{ inputs.reanalyze }}
        run: |
          if [ "$REANALYZE" = "true" ]; then
            # Clear the "Other" fallback below so re-analyzed repos can move
            starman categorize "" --cat-filter "Other"
            starman analyze --all --force
          else
            starman analyze --all
          fi

          # starman's unmatched fallback is literally "others".
          # Normalize it for the generated list.
          starman categorize "Other" --cat-filter "others"

      - name: Generate README
        run: |
          starman generate \
            --sort category \
            --template .github/starman.tmpl \
            --output README.md

      - name: Save database
        run: |
          mkdir -p starman-backup
          cp "$HOME/.starman/starman.db" starman-backup/starman.db

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md starman-backup/starman.db

          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi

          git commit -m "chore: update starred repositories"
          git push
